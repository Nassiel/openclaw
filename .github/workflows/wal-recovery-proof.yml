# Temporary diagnostic replay for PR154905. Remove before landing.
name: WAL recovery cohort proof
on:
  push:
    branches: [test/wal-recovery-context]
    paths: [.github/workflows/wal-recovery-proof.yml]
permissions:
  contents: read
concurrency:
  group: wal-recovery-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-cohort:
    if: github.repository == 'openclaw/openclaw'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_VERSION: 24.19.0
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ""
    steps:
      - name: Checkout original failed composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b828baa3da39e8667fa2fac0207d0e9868995287
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate source and apply only reviewed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b828baa3da39e8667fa2fac0207d0e9868995287
          test "$(git rev-parse HEAD^{tree})" = 891905f2771d56a9c3597f51b8a97fa8e9425168
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin fff837a9842d09d32d3938cb622c743b8edba1b9
          python3 - <<'PY_SOURCE'
          import hashlib, json, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          diagnostic = 'fff837a9842d09d32d3938cb622c743b8edba1b9'
          path = 'src/config/sessions/session-history-wal-budget.test.ts'
          assert git('rev-parse', diagnostic + '^{tree}') == '0149cdf61506fe4e81ac0cba1e6d9b3670270e2f'
          assert git('rev-parse', 'HEAD:' + path) == 'e37897e1da6485b2660f04b7787c7cda6c6e0f97'
          assert git('rev-parse', diagnostic + ':' + path) == 'c2290bd669a841d7950056d302cd251ea90d12e6'
          report_blobs = {"src/cli/update-cli/update-command-result.ts": "05741e9f31d86c007b713f6f75d71d123172c56d", "src/cli/update-cli/update-command-service-admission.test.ts": "0bd4d718ac9fbdf4ea693ea9cc7d7a7ac3dfb24f", "src/infra/update-failure-report-artifact.test.ts": "308f7a8f66351e91045895943f1360bf0fdce0d4", "src/infra/update-failure-report-artifact.ts": "767d3d432845f5842fdac13cf29b4910f98332bb"}
          for name, blob in report_blobs.items():
              assert git('rev-parse', 'HEAD:' + name) == blob
          data = subprocess.check_output(['git', 'show', diagnostic + ':' + path])
          Path(path).write_bytes(data)
          assert git('hash-object', path) == 'c2290bd669a841d7950056d302cd251ea90d12e6'
          assert git('diff', '--name-only', 'HEAD') == path
          subprocess.run(['git', 'add', '--', path], check=True)
          assert git('write-tree') == '3fcf4626d03ce65e9c3f4379e81a6321fa96e8ac'
          print(json.dumps({'sourceHead': git('rev-parse', 'HEAD'), 'sourceTree': git('rev-parse', 'HEAD^{tree}'), 'diagnosticHead': diagnostic, 'diagnosticBlob': git('hash-object', path), 'testTree': git('write-tree'), 'diagnosticSha256': hashlib.sha256(data).hexdigest(), 'reportBlobs': report_blobs}))
          PY_SOURCE
      - name: Setup original Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: 24.x
          install-bun: "false"
          dependency-cache: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "true"
          node-compile-cache: "true"
          install-deps: "true"
          frozen-lockfile: "true"
          restore-test-caches: "false"
      - name: Authenticate runtime and original packed plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p process.versions.node)" = 24.19.0
          test "$(pnpm --version)" = 12.4.0
          git diff --exit-code
          test "$(git write-tree)" = 3fcf4626d03ce65e9c3f4379e81a6321fa96e8ac
          python3 - <<'PY_PLAN'
          import base64, gzip, hashlib, json, os
          packed = os.environ['OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64'].encode()
          assert len(packed) == 3744
          assert hashlib.sha256(packed).hexdigest() == '334a52d7b0aa8e93703c5263cd1be82bbf894a5bd71597f8627a9142079ca166'
          decoded = gzip.decompress(base64.b64decode(packed))
          assert hashlib.sha256(decoded).hexdigest() == '90df8cf8e39519ec58cccaa6ed2b8c410b5f9f88484b68dd486ce22fb511f862'
          groups = json.loads(decoded)
          assert [len(group['includePatterns']) for group in groups] == [42, 56, 86, 1, 27]
          print(json.dumps({'packedSha256': hashlib.sha256(packed).hexdigest(), 'decodedSha256': hashlib.sha256(decoded).hexdigest(), 'groups': groups}))
          PY_PLAN
      - name: Run original five packed groups
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
          FROZEN_TARGET: "false"
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OPENCLAW_NODE_TEST_GROUPS_JSON: ""
          OPENCLAW_NODE_TEST_CONFIGS_JSON: "null"
          OPENCLAW_NODE_TEST_ENV_JSON: "null"
          OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: "null"
          OPENCLAW_NODE_TEST_TARGETS_JSON: "null"
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
          OPENCLAW_VITEST_SHARD_NAME: compact-large-15
          OPENCLAW_VITEST_MAX_WORKERS: "2"
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_VITEST_NO_OUTPUT_RETRY: "1"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "2"
        run: |
          set -euo pipefail
          time -p node --import tsx scripts/ci-run-node-test-shard.mts
      - name: Record terminal source and memory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = b828baa3da39e8667fa2fac0207d0e9868995287
          test "$(git write-tree)" = 3fcf4626d03ce65e9c3f4379e81a6321fa96e8ac
          git rev-parse HEAD HEAD^{tree}
          git write-tree
          if peak_memory="$(cat /sys/fs/cgroup/memory.peak 2>/dev/null)"; then
            echo "runner cgroup peak memory bytes=$peak_memory"
          fi
